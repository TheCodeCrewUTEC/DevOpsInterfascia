name: interfascia

services:

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: interfascia-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_KEYCLOAK_ID: interfascia-frontend
      AUTH_KEYCLOAK_SECRET: ${KEYCLOAK_FRONTEND_CLIENT_SECRET}
      # El navegador llega a Keycloak por localhost; el contenedor, por la red de Docker
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/realms/interfascia
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/interfascia
      API_URL: http://backend:80

    depends_on:
      - backend
      - keycloak


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: interfascia-backend

    restart: unless-stopped

    ports:
      - "8000:80"

    env_file:
      - .env

    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/interfascia
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/interfascia

    depends_on:
      - db
      - keycloak


  keycloak:
    image: quay.io/keycloak/keycloak:26.4

    container_name: interfascia-keycloak

    restart: unless-stopped

    command: start-dev --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      # Los tokens siempre llevan localhost:8080 como emisor, aunque el pedido llegue por keycloak:8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KEYCLOAK_FRONTEND_CLIENT_SECRET: ${KEYCLOAK_FRONTEND_CLIENT_SECRET}
      # Usada por el tema para el navbar, el footer y el botón de cerrar
      INTERFASCIA_APP_URL: http://localhost:3000

    ports:
      - "8080:8080"

    volumes:
      # Montado en data/ (no en data/h2) para heredar los permisos del usuario keycloak de la imagen
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-interfascia.json:/opt/keycloak/data/import/realm-interfascia.json:ro
      - ./keycloak/themes/interfascia:/opt/keycloak/themes/interfascia:ro


  db:
    image: pgvector/pgvector:pg16

    container_name: interfascia-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: interfascia
      POSTGRES_USER: interfascia
      POSTGRES_PASSWORD: interfascia

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  keycloak_data: