name: interfascia

services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: interfascia-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: "http://localhost:3000"
      AUTH_TRUST_HOST: "true"

      AUTH_KEYCLOAK_ID: interfascia-frontend
      AUTH_KEYCLOAK_SECRET: ${KEYCLOAK_FRONTEND_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: "http://localhost:8080/realms/interfascia"
      KEYCLOAK_INTERNAL_ISSUER: "http://keycloak:8080/realms/interfascia"

      API_URL: "http://backend:80"
    depends_on:
      - backend
      - keycloak
    networks:
      - interfascia-net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: interfascia-backend
    container_name: interfascia-backend
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      API_URL: "http://backend:80"

      KEYCLOAK_ISSUER: "http://localhost:8080/realms/interfascia"
      KEYCLOAK_INTERNAL_ISSUER: "http://keycloak:8080/realms/interfascia"

      DATABASE_URL: "postgresql://interfascia:${POSTGRES_PASSWORD}@db:5432/interfascia"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: interfascia
      DB_USER: interfascia
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      HF_HOME: /hf-cache
      HF_HUB_DISABLE_XET: "1"

      # Correos de alertas (mismas variables SMTP que Keycloak)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_USER}}
      INTERFASCIA_APP_URL: "http://localhost:3000"

      # Métricas de uso (RF006-08): "0" deja de registrarlas
      REGISTRAR_USO: ${REGISTRAR_USO:-1}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}

    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - formularios_storage:/app/storage
      - huggingface_cache:/hf-cache
    networks:
      - interfascia-net

  worker:
    image: interfascia-backend
    container_name: interfascia-worker
    restart: unless-stopped
    command: ["python", "-m", "arq", "worker.worker.WorkerSettings"]
    cpus: 3
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://interfascia:${POSTGRES_PASSWORD}@db:5432/interfascia"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: interfascia
      DB_USER: interfascia
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      PYTHONUNBUFFERED: "1"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HOME: /hf-cache
      # Correos de alertas (mismas variables SMTP que Keycloak)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_USER}}
      INTERFASCIA_APP_URL: "http://localhost:3000"
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - formularios_storage:/app/storage
      - huggingface_cache:/hf-cache
    networks:
      - interfascia-net

  keycloak:
    build: ./keycloak
    image: interfascia-keycloak:26.4.7
    container_name: interfascia-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: "http://localhost:8080"

      KEYCLOAK_FRONTEND_CLIENT_SECRET: ${KEYCLOAK_FRONTEND_CLIENT_SECRET}
      KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET}

      INTERFASCIA_APP_URL: "http://localhost:3000"
      INTERFASCIA_API_URL: "http://backend:80"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:-keycloak}"
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_USER}}

    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-interfascia.json:/opt/keycloak/data/import/realm-interfascia.json:ro
      - ./keycloak/themes/interfascia:/opt/keycloak/themes/interfascia:ro
      - ./keycloak/truststore:/opt/keycloak/conf/truststores:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interfascia-net

  redis:
    image: redis:7.2-alpine
    container_name: interfascia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - interfascia-net

  # ---------- Monitoreo: Prometheus junta métricas, Grafana las muestra ----------
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: interfascia-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    networks:
      - interfascia-net

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: interfascia-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - redis-exporter
    networks:
      - interfascia-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: interfascia-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Lo usa el datasource de Postgres (monitoring/grafana/provisioning)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - db
    networks:
      - interfascia-net

  # ---------- Logs: Alloy lee los logs de los contenedores y los guarda en Loki ----------
  loki:
    image: grafana/loki:3.1.0
    container_name: interfascia-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - interfascia-net

  alloy:
    image: grafana/alloy:v1.3.0
    container_name: interfascia-alloy
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - interfascia-net

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    container_name: interfascia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: interfascia
      POSTGRES_USER: interfascia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interfascia -d interfascia"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - interfascia-net

volumes:
  postgres_data:
  formularios_storage:
  huggingface_cache:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  interfascia-net:
    name: interfascia-net
    driver: bridge
