name: interfascia

services:

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: interfascia-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://interfasciauy.com
      AUTH_TRUST_HOST: "true"

      AUTH_KEYCLOAK_ID: interfascia-frontend
      AUTH_KEYCLOAK_SECRET: ${KEYCLOAK_FRONTEND_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: https://auth.interfasciauy.com/realms/interfascia

      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/interfascia

      API_URL: http://backend:80

    depends_on:
      - backend
      - keycloak

    networks:
      - interfascia-net


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile

    container_name: interfascia-backend

    restart: unless-stopped

    ports:
      - "8000:80"

    env_file:
      - .env

    environment:
      KEYCLOAK_ISSUER: http://localhost:8080/realms/interfascia
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/interfascia

    depends_on:
      - db
      - keycloak

    networks:
      - interfascia-net


  keycloak:
    image: quay.io/keycloak/keycloak:26.4

    container_name: interfascia-keycloak

    restart: unless-stopped

    command: start-dev --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"

      KC_HOSTNAME: https://auth.interfasciauy.com
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded

      KEYCLOAK_FRONTEND_CLIENT_SECRET: ${KEYCLOAK_FRONTEND_CLIENT_SECRET}

      INTERFASCIA_APP_URL: https://interfasciauy.com

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    ports:
      - "8080:8080"

    volumes:
      - ./keycloak/realm-interfascia.json:/opt/keycloak/data/import/realm-interfascia.json:ro
      - ./keycloak/themes/interfascia:/opt/keycloak/themes/interfascia:ro

    depends_on:
      db:
        condition: service_healthy

    networks:
      - interfascia-net

  db:
    image: pgvector/pgvector:pg16

    container_name: interfascia-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: interfascia
      POSTGRES_USER: interfascia
      POSTGRES_PASSWORD: interfascia
      # Los usa db/init/01-keycloak.sh para crear la base de Keycloak
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interfascia -d interfascia"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - interfascia-net

volumes:
  postgres_data:

# Misma red (nombre y clave) que el compose de infraestructura, para que ambos compartan la base
networks:
  interfascia-net:
    name: interfascia-net
    driver: bridge