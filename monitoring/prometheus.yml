global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI: requests, latencia y errores por ruta (prometheus-fastapi-instrumentator)
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:80"]

  # Redis: cola de arq + caché de lecturas
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
