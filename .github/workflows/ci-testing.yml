name: Testing

on:
  
  pull_request:
    branches:
      - testing-pipeline
    types: [opened, synchronize, reopened]

  push:
    branches:
      - testing-pipeline
      - test-failTest
      - test-cve
      - test-success

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: Frontend
        run: npm ci --ignore-scripts

      - name: Ejecutar tests
        working-directory: Frontend
        run: npm test

      - name: Build Next
        working-directory: Frontend
        run: npm run build

  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: Backend
        run: "pip install --only-binary=:all: -r requirements.txt"

      - name: Ejecutar tests
        working-directory: Backend
        run: python -m pytest

      - name: Verificar FastAPI
        working-directory: Backend
        run: python -c "from main import app; print('FastAPI OK')"

  docker:
    name: Build Docker Compose
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imágenes Docker
        run: docker compose build

  docker-trivy:
    name: Build y análisis de vulnerabilidades
    runs-on: ubuntu-latest
    needs:
      - sonarqube
      - frontend
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -t interfascia-backend:inf-act05 ./Backend

      - name: Build Frontend
        run: docker build -t interfascia-frontend:inf-act05 ./Frontend

      - name: Trivy - Backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: interfascia-backend:inf-act05
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy - Frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: interfascia-frontend:inf-act05
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  publish-test:
    name: Publicar imágenes de testing en GHCR
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/testing/INF-ACT05'

    needs:
      - sonarqube
      - frontend
      - backend
      - docker
      - docker-trivy

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombres de imágenes
        id: images
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/interfascia-test-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/interfascia-test-frontend" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publicar Backend de testing
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.images.outputs.backend }}:inf-act05-${{ github.sha }}

      - name: Publicar Frontend de testing
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.images.outputs.frontend }}:inf-act05-${{ github.sha }}