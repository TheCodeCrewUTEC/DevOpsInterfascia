name: CI Interfascia

on:
  push:
    branches:
      - DevOps
      - main

  pull_request:
    branches:
      - main

jobs:

  sonarqube:
    name: Analisis SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Ejecutar análisis SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-trivy:
    name: Build y análisis de vulnerabilidades
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -t interfascia-backend:latest ./Backend

      - name: Build Frontend
        run: docker build -t interfascia-frontend:latest ./Frontend

      - name: Trivy - Backend
        run: trivy image  --severity CRITICAL --ignore-unfixed --exit-code 1 interfascia-backend:latest
        
      - name: Trivy - Frontend
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 interfascia-frontend:latest

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: Frontend
        run: npm ci

      - name: Ejecutar tests
        working-directory: Frontend
        run: npm test

      - name: Build Next
        working-directory: Frontend
        run: npm run build

  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: Backend
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        working-directory: Backend
        run: python -m pytest
      
      - name: Verificar FastAPI
        working-directory: Backend
        run: python -c "from main import app; print('FastAPI OK')"


  docker:
    name: Build Docker Compose
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagenes Docker
        run: docker compose build