name: Build
on:
  push:
    branches:
      - main
      - DevOps
      
  pull_request:
    types: [opened, synchronize, reopened]
    
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-trivy:
    name: Build y análisis de vulnerabilidades
    runs-on: ubuntu-latest
    needs: sonarqube

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Build Backend
        run: docker build -t interfascia-backend:latest ./Backend

      - name: Build Frontend
        run: docker build -t interfascia-frontend:latest ./Frontend

      - name: Trivy - Backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: interfascia-backend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy - Frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: interfascia-frontend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: Frontend
        run: npm ci --ignore-scripts

      - name: Ejecutar tests
        working-directory: Frontend
        run: npm test

      - name: Build Next
        working-directory: Frontend
        run: npm run build

  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: Backend
        run: "pip install --only-binary=:all: -r requirements.txt"

      - name: Ejecutar tests
        working-directory: Backend
        run: python -m pytest
      
      - name: Verificar FastAPI
        working-directory: Backend
        run: python -c "from main import app; print('FastAPI OK')"


  docker:
    name: Build Docker Compose
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagenes Docker
        run: docker compose build

  publish:
    name: Publicar en GHCR
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs:
      - frontend
      - backend
      - docker-trivy
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Nombres de imagen
        id: images
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${owner}/interfascia-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${owner}/interfascia-frontend" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
            ${{ steps.images.outputs.backend }}:latest

      - name: Publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
            ${{ steps.images.outputs.frontend }}:latest
