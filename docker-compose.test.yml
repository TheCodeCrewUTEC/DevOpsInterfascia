# Base de pruebas, separada de la de desarrollo (proyecto Compose "interfascia").
# No usa el contenedor interfascia-db ni el volumen postgres_data.
#
# Desde la raíz del repo:
#   docker compose --env-file .env.test -f docker-compose.test.yml up -d

name: interfascia-test

services:
  db-test:
    image: pgvector/pgvector:pg16
    container_name: interfascia-db-test
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: interfascia_test
      POSTGRES_USER: interfascia_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-interfascia_test_local_2026}
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interfascia_test -d interfascia_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - interfascia-test-net

volumes:
  postgres_data_test:

networks:
  interfascia-test-net:
    name: interfascia-test-net
    driver: bridge
